section: Terminal and shell
category: PowerShell

items:
  - id: windows-terminal-update
    name: Update Windows Terminal
    description: Close any open Terminal windows first.
    category: Windows Terminal
    dependsOn: [windows-terminal]
    detect: |
      -not ((winget upgrade --accept-source-agreements --disable-interactivity) -match 'Microsoft\.WindowsTerminal\s')
    apply: |
      winget upgrade --id Microsoft.WindowsTerminal -e --silent --accept-source-agreements --accept-package-agreements --disable-interactivity

  - id: windows-terminal-settings
    name: "Windows Terminal: apply settings"
    description: Opens maximized, uses the Consolas font, and the One Half Dark colors for Windows PowerShell.
    category: Windows Terminal
    dependsOn: [windows-terminal]
    # Only these values are checked and written; everything else in settings.json (including the profiles Terminal
    # generates for WSL, Visual Studio and so on) is left alone. Terminal reloads the file on its own.
    # Same values as the apply below.
    detect: |
      $f = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json"
      if (-not (Test-Path $f)) { return $false }
      $s = Get-Content $f -Raw -Encoding UTF8 | ConvertFrom-Json
      $ps = @($s.profiles.list) | Where-Object { $_.guid -eq '{61c54bbd-c2c6-5271-96e7-009a87ff44bf}' } | Select-Object -First 1
      $s.launchMode -eq 'maximized' -and $s.profiles.defaults.font.face -eq 'Consolas' -and $ps.colorScheme -eq 'One Half Dark'
    apply: |
      $f = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json"
      function Set-Prop($obj, [string]$name, $value) {
          if ($obj.PSObject.Properties[$name]) { $obj.$name = $value } else { $obj | Add-Member -NotePropertyName $name -NotePropertyValue $value }
      }
      if (Test-Path $f) {
          try { $s = Get-Content $f -Raw -Encoding UTF8 | ConvertFrom-Json }
          catch { throw "Couldn't read Terminal's settings.json (comments in it can cause this): $($_.Exception.Message)" }
      } else {
          # Terminal hasn't run yet; it fills in everything else on first start.
          New-Item -ItemType Directory -Force (Split-Path $f) | Out-Null
          $s = [pscustomobject]@{ '$schema' = 'https://aka.ms/terminal-profiles-schema' }
      }
      Set-Prop $s 'launchMode' 'maximized'
      if (-not $s.profiles) { Set-Prop $s 'profiles' ([pscustomobject]@{}) }
      if (-not $s.profiles.defaults) { Set-Prop $s.profiles 'defaults' ([pscustomobject]@{}) }
      if (-not $s.profiles.defaults.font) { Set-Prop $s.profiles.defaults 'font' ([pscustomobject]@{}) }
      Set-Prop $s.profiles.defaults.font 'face' 'Consolas'
      $list = @($s.profiles.list | Where-Object { $_ })
      $ps = $list | Where-Object { $_.guid -eq '{61c54bbd-c2c6-5271-96e7-009a87ff44bf}' } | Select-Object -First 1
      if (-not $ps) { $ps = [pscustomobject]@{ guid = '{61c54bbd-c2c6-5271-96e7-009a87ff44bf}' }; $list += $ps }
      Set-Prop $ps 'colorScheme' 'One Half Dark'
      Set-Prop $s.profiles 'list' $list
      [IO.File]::WriteAllText($f, ($s | ConvertTo-Json -Depth 32), (New-Object Text.UTF8Encoding $false))

  - id: terminal-settings-link
    name: Use your synced Terminal settings
    description: The current settings are backed up first.
    category: Windows Terminal
    dependsOn: [windows-terminal, syncthing]
    requires:
      test: Test-Path "$env:USERPROFILE\Syncthing\PowerShell\settings.json"
      hint: Wait for Syncthing to sync the PowerShell folder, then retry.
    detect: |
      $s = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json"
      (Get-Item $s -ErrorAction SilentlyContinue).LinkType -eq 'SymbolicLink'
    apply: |
      $s = "$env:LOCALAPPDATA\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json"
      New-Item -ItemType Directory -Path (Split-Path $s) -Force | Out-Null
      if (Test-Path $s) { Copy-Item $s "$s.bak" -Force }
      Remove-Item $s -Force -ErrorAction SilentlyContinue
      New-Item -ItemType SymbolicLink -Path $s -Target "$env:USERPROFILE\Syncthing\PowerShell\settings.json" | Out-Null

  - id: powershell-profile-github
    name: Use your PowerShell profile from GitHub
    description: For PCs without Syncthing. The first PowerShell window signs in to GitHub if needed; after that it stays up to date on its own.
    dependsOn: [gh, powershell-execution-policy]
    # Writes a small loader into both profiles (Windows PowerShell and PowerShell 7). The loader runs the cached copy of
    # your profile, refreshes it from the private repo in the background, and on a new PC signs in with gh the first
    # time you open PowerShell yourself. A profile already linked to Syncthing is left alone.
    detect: |
      $docs = [Environment]::GetFolderPath('MyDocuments')
      $synced = Join-Path $env:USERPROFILE 'Syncthing\PowerShell\Microsoft.PowerShell_profile.ps1'
      -not ('WindowsPowerShell', 'PowerShell' | Where-Object {
          $p = Join-Path $docs "$_\Microsoft.PowerShell_profile.ps1"
          $i = Get-Item $p -ErrorAction SilentlyContinue
          -not (($i.LinkType -eq 'SymbolicLink' -and $i.Target -eq $synced) -or
                ($i -and (Get-Content $p -TotalCount 1) -eq '# PC Setup profile loader v1'))
      })
    apply: |
      $loader = @'
      # PC Setup profile loader v1
      # Loads your PowerShell profile from GitHub (micahmo/powershell-profile). The cached copy loads right away and a
      # fresh one is fetched in the background for the next window. On a new PC, the first window signs in to GitHub.
      $pcsProfile = Join-Path $env:LOCALAPPDATA 'PCSetup\profile\Microsoft.PowerShell_profile.ps1'
      $pcsFetch = {
          param($target)
          $b64 = gh api repos/micahmo/powershell-profile/contents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1 --jq .content 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $b64) { return $false }
          New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
          $tmp = "$target.$PID.tmp"
          [IO.File]::WriteAllBytes($tmp, [Convert]::FromBase64String(($b64 -join '')))
          Move-Item $tmp $target -Force -ErrorAction SilentlyContinue
          Remove-Item $tmp -ErrorAction SilentlyContinue
          return $true
      }
      if (Get-Command gh -ErrorAction SilentlyContinue) {
          if (Test-Path $pcsProfile) {
              # Refresh for the next window without slowing this one.
              $pcsCmd = "& { $pcsFetch } '$pcsProfile'"
              Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile', '-NonInteractive', '-EncodedCommand',
                  ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($pcsCmd)))
          } elseif ($Host.Name -eq 'ConsoleHost' -and [Environment]::UserInteractive -and -not ([Environment]::GetCommandLineArgs() -match '^-NonI')) {
              # First window on this PC: sign in if needed, then download and use the profile.
              gh auth status *> $null
              if ($LASTEXITCODE -ne 0) {
                  Write-Host 'Signing in to GitHub to get your PowerShell profile...'
                  gh auth login --hostname github.com --git-protocol https --web
              }
              if (-not (& $pcsFetch $pcsProfile)) { Write-Warning "Couldn't download your PowerShell profile from GitHub." }
          }
      }
      if (Test-Path $pcsProfile) { . $pcsProfile }
      Remove-Variable pcsProfile, pcsFetch, pcsCmd -ErrorAction SilentlyContinue
      '@
      $docs = [Environment]::GetFolderPath('MyDocuments')
      $synced = Join-Path $env:USERPROFILE 'Syncthing\PowerShell\Microsoft.PowerShell_profile.ps1'
      foreach ($folder in 'WindowsPowerShell', 'PowerShell') {
          $p = Join-Path $docs "$folder\Microsoft.PowerShell_profile.ps1"
          $i = Get-Item $p -ErrorAction SilentlyContinue
          if ($i.LinkType -eq 'SymbolicLink' -and $i.Target -eq $synced) { Write-Output "$folder profile already uses Syncthing; leaving it."; continue }
          if ($i -and $i.Length -gt 0 -and (Get-Content $p -TotalCount 1) -notlike '# PC Setup profile loader*') {
              Copy-Item $p "$p.bak" -Force
              Write-Output "Saved the existing $folder profile as $(Split-Path $p -Leaf).bak."
          }
          if ($i) { Remove-Item $p -Force }
          New-Item -ItemType Directory -Force (Split-Path $p) | Out-Null
          # UTF-8 with a BOM, so Windows PowerShell reads it right.
          [IO.File]::WriteAllText($p, ($loader -replace "`r?`n", "`r`n") + "`r`n", (New-Object Text.UTF8Encoding $true))
      }

  - id: powershell-profile-link
    name: Use your synced PowerShell profile
    description: Links both PowerShell profiles to the one in Syncthing. A profile you edited yourself is backed up first.
    dependsOn: [syncthing]
    requires:
      test: Test-Path "$env:USERPROFILE\Syncthing\PowerShell\Microsoft.PowerShell_profile.ps1"
      hint: Wait for Syncthing to sync the PowerShell folder, then retry.
    detect: |
      $docs = [Environment]::GetFolderPath('MyDocuments')
      $synced = Join-Path $env:USERPROFILE 'Syncthing\PowerShell\Microsoft.PowerShell_profile.ps1'
      -not ('WindowsPowerShell', 'PowerShell' | Where-Object {
          $i = Get-Item (Join-Path $docs "$_\Microsoft.PowerShell_profile.ps1") -ErrorAction SilentlyContinue
          -not ($i.LinkType -eq 'SymbolicLink' -and $i.Target -eq $synced)
      })
    apply: |
      $docs = [Environment]::GetFolderPath('MyDocuments')
      $synced = Join-Path $env:USERPROFILE 'Syncthing\PowerShell\Microsoft.PowerShell_profile.ps1'
      foreach ($folder in 'WindowsPowerShell', 'PowerShell') {
          $p = Join-Path $docs "$folder\Microsoft.PowerShell_profile.ps1"
          $i = Get-Item $p -ErrorAction SilentlyContinue
          if ($i.LinkType -eq 'SymbolicLink' -and $i.Target -eq $synced) { continue }
          if ($i) {
              # Back up only a profile you made: not the GitHub loader, a link, or a copy identical to the synced one.
              $mine = $i.LinkType -eq $null -and $i.Length -gt 0 -and
                  (Get-Content $p -TotalCount 1) -notlike '# PC Setup profile loader*' -and
                  (Get-FileHash $p).Hash -ne (Get-FileHash $synced).Hash
              if ($mine) { Copy-Item $p "$p.bak" -Force; Write-Output "Saved the existing $folder profile as $(Split-Path $p -Leaf).bak." }
              Remove-Item $p -Force
          }
          New-Item -ItemType Directory -Force (Split-Path $p) | Out-Null
          New-Item -ItemType SymbolicLink -Path $p -Target $synced | Out-Null
      }
      # The GitHub loader's cached copy isn't needed once Syncthing provides the profile.
      Remove-Item (Join-Path $env:LOCALAPPDATA 'PCSetup\profile') -Recurse -Force -ErrorAction SilentlyContinue

  - id: powershell-execution-policy
    name: Let PowerShell run your own scripts
    registry:
      - path: HKCU\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell
        name: ExecutionPolicy
        type: String
        value: RemoteSigned

  - id: powershell-modules
    name: Install PowerShell modules
    description: posh-git, Terminal-Icons, and the latest PSReadLine.
    # The newer PSReadLine loads through a script, so without the policy PowerShell starts without it.
    dependsOn: [powershell-execution-policy]
    detect: |
      (Get-Module -ListAvailable posh-git) -and (Get-Module -ListAvailable Terminal-Icons) -and
      ((Get-Module -ListAvailable PSReadLine | Sort-Object Version -Descending | Select-Object -First 1).Version -ge [version]'2.3')
    apply: |
      [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
      if (-not (Get-PackageProvider -ListAvailable -Name NuGet -ErrorAction SilentlyContinue | Where-Object Version -ge '2.8.5.201')) {
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
      }
      Install-Module posh-git -Scope CurrentUser -Force
      Install-Module Terminal-Icons -Scope CurrentUser -Force
      Install-Module PSReadLine -Scope CurrentUser -Force -AllowClobber -SkipPublisherCheck
