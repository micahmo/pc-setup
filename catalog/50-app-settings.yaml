section: App settings

# Most of these are manual for now. Turn them into scripts (or add a detect) as the exact settings get written down.
items:
  - id: vscode-sign-in
    name: "VS Code: turn on Settings Sync"
    description: Brings back your extensions, settings, and keyboard shortcuts.
    category: Development
    dependsOn: [vscode]
    instructions: In VS Code, select the account icon at the bottom left, then Backup and Sync Settings, and sign in with your Microsoft account. Then sign in to any extensions that need it.
    # Ticks off once Settings Sync is on. VS Code keeps that in its own SQLite database, read here with the
    # SQLite that ships with Windows; read-only, so it's fine while VS Code is open.
    detect: |
      $db = Join-Path $env:APPDATA 'Code\User\globalStorage\state.vscdb'
      if (-not (Test-Path $db)) { return $false }
      Add-Type -Language CSharp @'
      using System;
      using System.Runtime.InteropServices;
      public static class PcsVsCodeState {
          [DllImport("winsqlite3.dll", CharSet = CharSet.Ansi)] static extern int sqlite3_open_v2(string file, out IntPtr db, int flags, IntPtr vfs);
          [DllImport("winsqlite3.dll", CharSet = CharSet.Ansi)] static extern int sqlite3_prepare_v2(IntPtr db, string sql, int len, out IntPtr stmt, IntPtr tail);
          [DllImport("winsqlite3.dll")] static extern int sqlite3_step(IntPtr stmt);
          [DllImport("winsqlite3.dll")] static extern IntPtr sqlite3_column_text(IntPtr stmt, int col);
          [DllImport("winsqlite3.dll")] static extern int sqlite3_finalize(IntPtr stmt);
          [DllImport("winsqlite3.dll")] static extern int sqlite3_close(IntPtr db);
          public static string Get(string file, string key) {
              IntPtr db, stmt;
              if (sqlite3_open_v2(file, out db, 1 /* read-only */, IntPtr.Zero) != 0) { sqlite3_close(db); return null; }
              try {
                  if (sqlite3_prepare_v2(db, "SELECT value FROM ItemTable WHERE key = '" + key.Replace("'", "''") + "'", -1, out stmt, IntPtr.Zero) != 0) return null;
                  try { return sqlite3_step(stmt) == 100 /* row */ ? Marshal.PtrToStringAnsi(sqlite3_column_text(stmt, 0)) : null; }
                  finally { sqlite3_finalize(stmt); }
              } finally { sqlite3_close(db); }
          }
      }
      '@
      [PcsVsCodeState]::Get($db, 'sync.enable') -eq 'true'

  - id: firefox-settings
    name: "Firefox: apply settings"
    description: Reopens your tabs, Backspace goes back, strict tracking protection, a bare new tab page, a home button, no bookmarks bar, Google Images search, uBlock Origin, and more. Firefox will say it's managed by your organization. Takes effect the next time Firefox starts.
    category: Browsers and productivity
    dependsOn: [firefox]
    # Firefox policies for most of it. The preferences are defaults, not locks, so they can still be changed in
    # Firefox, and a signed-in Firefox account syncs its own values over them. The one preference policies can't
    # set (the delay on dialog buttons) goes in Firefox's own config file next to firefox.exe.
    # Same values as the apply below.
    detect: |
      $ff = 'HKLM:\SOFTWARE\Policies\Mozilla\Firefox'
      $exeDir = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\firefox.exe' -ErrorAction SilentlyContinue).Path
      if (-not $exeDir) { $exeDir = Join-Path $env:ProgramFiles 'Mozilla Firefox' }
      $toolbar = [ordered]@{
          placements = [ordered]@{ 'nav-bar' = @('back-button', 'forward-button', 'stop-reload-button', 'vertical-spacer', 'home-button',
              'urlbar-container', 'unified-extensions-button', 'downloads-button', 'fxa-toolbar-menu-button') }
          currentVersion = 28
      } | ConvertTo-Json -Depth 5 -Compress
      $prefs = [ordered]@{
          'browser.startup.page'                                         = 3        # open previous windows and tabs
          'browser.backspace_action'                                     = 0        # Backspace goes back
          'browser.urlbar.autoFill.adaptiveHistory.enabled'              = $true    # autofill from history, like Chrome
          'browser.formfill.enable'                                      = $false   # don't remember search and form history
          'browser.contentblocking.category'                             = 'strict'
          'signon.rememberSignons'                                       = $false   # no password saving; KeePassXC does that
          'signon.generation.enabled'                                    = $false
          'signon.management.page.breach-alerts.enabled'                 = $false
          'browser.newtabpage.activity-stream.feeds.topsites'            = $false   # bare new tab page
          'browser.newtabpage.activity-stream.feeds.section.topstories'  = $false
          'browser.newtabpage.activity-stream.showSponsoredTopSites'     = $false
          'browser.newtabpage.activity-stream.showWeather'               = $false
          'browser.newtabpage.activity-stream.widgets.privacy.enabled'   = $false
          'browser.newtabpage.activity-stream.widgets.sportsWidget.enabled' = $false
          'browser.newtabpage.activity-stream.widgets.stocks.enabled'    = $false
          'browser.uiCustomization.state'                                = $toolbar # home button, no flexible spaces
          'browser.toolbarbuttons.introduced.sidebar-button'             = $true    # don't add the sidebar button
          'browser.aboutwelcome.enabled'                                 = $false   # no welcome screen
      }
      $p = [ordered]@{}; foreach ($k in $prefs.Keys) { $p[$k] = [ordered]@{ Value = $prefs[$k]; Status = 'default' } }
      $want = @(
          @{ Key = $ff; Name = 'Preferences'; Value = ($p | ConvertTo-Json -Depth 5 -Compress) }
          @{ Key = $ff; Name = 'ShowHomeButton'; Value = 1 }
          @{ Key = $ff; Name = 'DisplayBookmarksToolbar'; Value = 'never' }
          @{ Key = $ff; Name = 'OverrideFirstRunPage'; Value = '' }
          @{ Key = $ff; Name = 'OverridePostUpdatePage'; Value = '' }
          @{ Key = $ff; Name = 'ExtensionSettings'; Value = '{"uBlock0@raymondhill.net":{"installation_mode":"normal_installed","default_area":"menupanel","install_url":"https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"}}' }
          @{ Key = "$ff\SearchEngines\Add\1"; Name = 'Name'; Value = 'Google Images' }
          @{ Key = "$ff\SearchEngines\Add\1"; Name = 'URLTemplate'; Value = 'https://images.google.com/images?hl=en&source=hp&q={searchTerms}&btnG=Search+Images&gbv=2' }
          @{ Key = "$ff\SearchEngines\Add\1"; Name = 'Alias'; Value = 'images' }
      )
      $i = 0; foreach ($n in 'Bing', 'DuckDuckGo', 'Perplexity', 'Wikipedia (en)', 'eBay', 'Amazon.com', 'Startpage') { $i++; $want += @{ Key = "$ff\SearchEngines\Remove"; Name = "$i"; Value = $n } }
      foreach ($w in $want) {
          $item = Get-ItemProperty $w.Key -ErrorAction SilentlyContinue
          if (-not $item -or -not $item.PSObject.Properties[$w.Name]) { return $false }
          $v = $item.($w.Name)
          if ((@($v) -join "`n") -ne "$($w.Value)") { return $false }
      }
      $cfg = Join-Path $exeDir 'pcsetup.cfg'
      (Test-Path (Join-Path $exeDir 'defaults\pref\pcsetup-autoconfig.js')) -and (Test-Path $cfg) -and
          ((Get-Content $cfg -Raw) -match 'defaultPref\("security\.dialog_enable_delay", 0\)')
    apply: |
      $ff = 'HKLM:\SOFTWARE\Policies\Mozilla\Firefox'
      $exeDir = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\firefox.exe' -ErrorAction SilentlyContinue).Path
      if (-not $exeDir) { $exeDir = Join-Path $env:ProgramFiles 'Mozilla Firefox' }
      if (-not (Test-Path (Join-Path $exeDir 'firefox.exe'))) { throw "Firefox isn't installed where expected ($exeDir)." }
      $toolbar = [ordered]@{
          placements = [ordered]@{ 'nav-bar' = @('back-button', 'forward-button', 'stop-reload-button', 'vertical-spacer', 'home-button',
              'urlbar-container', 'unified-extensions-button', 'downloads-button', 'fxa-toolbar-menu-button') }
          currentVersion = 28
      } | ConvertTo-Json -Depth 5 -Compress
      $prefs = [ordered]@{
          'browser.startup.page'                                         = 3
          'browser.backspace_action'                                     = 0
          'browser.urlbar.autoFill.adaptiveHistory.enabled'              = $true
          'browser.formfill.enable'                                      = $false
          'browser.contentblocking.category'                             = 'strict'
          'signon.rememberSignons'                                       = $false
          'signon.generation.enabled'                                    = $false
          'signon.management.page.breach-alerts.enabled'                 = $false
          'browser.newtabpage.activity-stream.feeds.topsites'            = $false
          'browser.newtabpage.activity-stream.feeds.section.topstories'  = $false
          'browser.newtabpage.activity-stream.showSponsoredTopSites'     = $false
          'browser.newtabpage.activity-stream.showWeather'               = $false
          'browser.newtabpage.activity-stream.widgets.privacy.enabled'   = $false
          'browser.newtabpage.activity-stream.widgets.sportsWidget.enabled' = $false
          'browser.newtabpage.activity-stream.widgets.stocks.enabled'    = $false
          'browser.uiCustomization.state'                                = $toolbar
          'browser.toolbarbuttons.introduced.sidebar-button'             = $true
          'browser.aboutwelcome.enabled'                                 = $false
      }
      $p = [ordered]@{}; foreach ($k in $prefs.Keys) { $p[$k] = [ordered]@{ Value = $prefs[$k]; Status = 'default' } }
      New-Item $ff -Force | Out-Null
      Set-ItemProperty $ff -Name Preferences -Value @($p | ConvertTo-Json -Depth 5 -Compress) -Type MultiString
      Set-ItemProperty $ff -Name ShowHomeButton -Value 1 -Type DWord
      Set-ItemProperty $ff -Name DisplayBookmarksToolbar -Value 'never' -Type String
      # No welcome or what's-new pages; an empty value means none.
      Set-ItemProperty $ff -Name OverrideFirstRunPage -Value '' -Type String
      Set-ItemProperty $ff -Name OverridePostUpdatePage -Value '' -Type String
      Set-ItemProperty $ff -Name ExtensionSettings -Type MultiString -Value @('{"uBlock0@raymondhill.net":{"installation_mode":"normal_installed","default_area":"menupanel","install_url":"https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"}}')

      # Search: add Google Images, hide every built-in engine but Google. Remove is rewritten whole.
      $add = "$ff\SearchEngines\Add\1"
      New-Item $add -Force | Out-Null
      Set-ItemProperty $add -Name Name -Value 'Google Images'
      Set-ItemProperty $add -Name URLTemplate -Value 'https://images.google.com/images?hl=en&source=hp&q={searchTerms}&btnG=Search+Images&gbv=2'
      Set-ItemProperty $add -Name Alias -Value 'images'
      $remove = "$ff\SearchEngines\Remove"
      if (Test-Path $remove) { Remove-Item $remove -Recurse -Force }
      New-Item $remove -Force | Out-Null
      $i = 0; foreach ($n in 'Bing', 'DuckDuckGo', 'Perplexity', 'Wikipedia (en)', 'eBay', 'Amazon.com', 'Startpage') { $i++; Set-ItemProperty $remove -Name "$i" -Value $n }

      # No delay before dialog buttons work. Firefox reads every .js file in defaults\pref; this one points it at
      # pcsetup.cfg, whose first line is skipped. defaultPref leaves it changeable in about:config.
      $ascii = New-Object Text.ASCIIEncoding
      [IO.File]::WriteAllText((Join-Path $exeDir 'defaults\pref\pcsetup-autoconfig.js'),
          "// PC Setup: lets pcsetup.cfg set defaults that Firefox policies can't.`r`npref(`"general.config.filename`", `"pcsetup.cfg`");`r`npref(`"general.config.obscure_value`", 0);`r`n", $ascii)
      [IO.File]::WriteAllText((Join-Path $exeDir 'pcsetup.cfg'),
          "// PC Setup`r`ndefaultPref(`"security.dialog_enable_delay`", 0);`r`n", $ascii)

      if (Get-Process firefox -ErrorAction SilentlyContinue) { Write-Output 'Firefox is open; these take effect the next time it starts.' }

  - id: keepassxc-settings
    name: "KeePassXC: settings and browser integration"
    category: Passwords
    dependsOn: [keepassxc]
    instructions: Turn on browser integration for Firefox and Edge, and install the KeePassXC-Browser extension in both.
    # Ticks off once browser integration is on for both browsers.
    detect: |
      $ini = "$env:APPDATA\KeePassXC\keepassxc.ini", "$env:LOCALAPPDATA\KeePassXC\keepassxc.ini" | Where-Object { Test-Path $_ }
      $text = ($ini | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
      $browser = [regex]::Match($text, '(?ms)^\[Browser\]\s*$(.*?)(^\[|\z)').Groups[1].Value
      $browser -match '(?m)^Enabled=true' -and $browser -match '(?m)^Firefox=true' -and $browser -match '(?m)^Edge=true'

  - id: everything-settings
    name: "Everything: apply settings"
    description: Starts with Windows, checks for updates, keeps search and run history, and sorts by newest first. Restarts Everything.
    category: Browsers and productivity
    dependsOn: [everything]
    # Everything keeps its settings in Everything.ini, in AppData unless the copy next to the exe says otherwise.
    # Only these keys are checked and written. Same values as the apply below.
    detect: |
      $exe = Join-Path $env:ProgramFiles 'Everything\Everything.exe'
      $dir = Join-Path $env:APPDATA 'Everything'
      if ((Get-Content (Join-Path (Split-Path $exe) 'Everything.ini') -ErrorAction SilentlyContinue) -contains 'app_data=0') { $dir = Split-Path $exe }
      $ini = Join-Path $dir 'Everything.ini'
      if (-not (Test-Path $ini)) { return $false }
      $lines = Get-Content $ini -Encoding UTF8
      $want = [ordered]@{
          check_for_updates_on_startup = '1'
          search_history_enabled       = '1'
          run_history_enabled          = '1'
          sort                         = 'Date Modified'
          sort_ascending               = '0'
      }
      foreach ($k in $want.Keys) { if ($lines -notcontains "$k=$($want[$k])") { return $false } }
      $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      [bool](Get-ItemProperty $run -ErrorAction SilentlyContinue | Where-Object { $_.Everything })
    apply: |
      # The indexing service is also called Everything; it runs in session 0, the app in yours.
      $running = @(Get-Process Everything -ErrorAction SilentlyContinue | Where-Object SessionId -ne 0)
      $exe = if ($running.Count -gt 0) { $running[0].Path } else { Join-Path $env:ProgramFiles 'Everything\Everything.exe' }
      $dir = Join-Path $env:APPDATA 'Everything'
      if ((Get-Content (Join-Path (Split-Path $exe) 'Everything.ini') -ErrorAction SilentlyContinue) -contains 'app_data=0') { $dir = Split-Path $exe }
      $ini = Join-Path $dir 'Everything.ini'

      # Everything writes its settings when it exits, so let it exit cleanly first. The indexing service keeps running.
      # (-wait is 1.5 only; 1.4 answers unknown options with its help window.)
      if ($running.Count -gt 0) {
          Write-Output 'Closing Everything.'
          Start-Process $exe -ArgumentList '-exit' -Wait
          $running | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
          if (Get-Process -Id $running.Id -ErrorAction SilentlyContinue) {
              throw "Everything didn't close, so its settings weren't changed. Close it from its tray icon and try again."
          }
      }

      $want = [ordered]@{
          check_for_updates_on_startup = '1'
          search_history_enabled       = '1'
          run_history_enabled          = '1'
          sort                         = 'Date Modified'
          sort_ascending               = '0'
      }
      New-Item -ItemType Directory -Force $dir | Out-Null
      $lines = New-Object Collections.Generic.List[string]
      if (Test-Path $ini) { $lines.AddRange([string[]](Get-Content $ini -Encoding UTF8)) }
      if (-not $lines.Contains('[Everything]')) { $lines.Add('[Everything]') }
      foreach ($k in $want.Keys) {
          $i = $lines.FindIndex({ param($l) $l.StartsWith("$k=") })
          if ($i -ge 0) { $lines[$i] = "$k=$($want[$k])" }
          else { $lines.Insert($lines.IndexOf('[Everything]') + 1, "$k=$($want[$k])") }
      }
      [IO.File]::WriteAllLines($ini, $lines, (New-Object Text.UTF8Encoding $false))

      # The same startup entry Everything's own "Start Everything on system startup" option writes.
      $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      if (-not (Get-ItemProperty $run -ErrorAction SilentlyContinue | Where-Object { $_.Everything })) {
          Set-ItemProperty $run[0] -Name Everything -Value "`"$exe`" -startup"
      }

      # Start it in the tray through Explorer so it doesn't run as admin. Explorer can't pass arguments,
      # so it opens a temporary shortcut that carries -startup.
      $lnk = Join-Path $env:TEMP 'pcs-everything.lnk'
      $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
      $sc.TargetPath = $exe; $sc.Arguments = '-startup'; $sc.Save()
      Start-Process explorer.exe "`"$lnk`""
      Start-Sleep -Seconds 5
      Remove-Item $lnk -ErrorAction SilentlyContinue

  - id: ditto-settings
    name: "Ditto: apply settings"
    description: Keeps up to 500 copies and skips the message at startup.
    category: Browsers and productivity
    dependsOn: [ditto]
    # Ditto reads these from the registry when it needs them, so no restart. Everything else in your notes is
    # Ditto's default, and its installer already adds it to startup.
    registry:
      - path: HKCU\Software\Ditto
        name: CheckForMaxEntries
        value: 1
      - path: HKCU\Software\Ditto
        name: MaxEntries
        value: 500
      - path: HKCU\Software\Ditto
        name: ShowStartupMessage
        value: 0

  - id: sharex-settings
    name: "ShareX: apply settings"
    description: Light theme, Print Screen captures a region, a quick menu after each capture, no sounds, and more. Restarts ShareX.
    category: Utilities
    dependsOn: [sharex]
    # ShareX keeps its settings in JSON next to the screenshots. Only these values are checked and written;
    # everything else in the files is left alone. A missing file gets just these values, and ShareX fills in
    # its own defaults for the rest. Same values as the apply below.
    detect: |
      $dir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ShareX'
      $appFile = Join-Path $dir 'ApplicationConfig.json'
      $hotFile = Join-Path $dir 'HotkeysConfig.json'
      if (-not (Test-Path $appFile) -or -not (Test-Path $hotFile)) { return $false }
      $a = Get-Content $appFile -Raw -Encoding UTF8 | ConvertFrom-Json
      $h = Get-Content $hotFile -Raw -Encoding UTF8 | ConvertFrom-Json
      function Get-Setting($obj, [string]$path) {
          foreach ($p in $path.Split('.')) { if ($null -eq $obj) { return $null }; $obj = $obj.$p }
          $obj
      }
      $want = [ordered]@{
          'UseWhiteShareXIcon'                                                    = $true
          'DefaultTaskSettings.AfterCaptureJob'                                   = 'ShowQuickTaskMenu'
          'DefaultTaskSettings.GeneralSettings.PlaySoundAfterCapture'             = $false
          'DefaultTaskSettings.GeneralSettings.PlaySoundAfterUpload'              = $false
          'DefaultTaskSettings.GeneralSettings.ToastWindowDuration'               = 30
          'DefaultTaskSettings.CaptureSettings.ShowCursor'                        = $false
          'DefaultTaskSettings.CaptureSettings.CaptureTransparent'                = $true
          'DefaultTaskSettings.CaptureSettings.GIFFPS'                            = 30
          'DefaultTaskSettings.CaptureSettings.SurfaceOptions.ImageEditorStartMode' = 'Maximized'
      }
      foreach ($k in $want.Keys) {
          $v = Get-Setting $a $k
          if ($null -eq $v -or $v -ne $want[$k]) { return $false }
      }
      # Light is the second built-in theme; ShareX lists the themes once it has saved the file itself.
      $theme = if ($a.Themes) { $a.Themes[[int]$a.SelectedTheme].Name } elseif ($a.SelectedTheme -eq 1) { 'Light' }
      if ($theme -ne 'Light') { return $false }
      $quick = if ($a.QuickTaskPresets) { @($a.QuickTaskPresets | ForEach-Object { "$($_.Name)|$($_.AfterCaptureTasks)" }) -join ';' }
      if ($quick -ne '|AnnotateImage;|CopyImageToClipboard;Save image to file|SaveImageToFile, CopyFilePathToClipboard;OCR|DoOCR') { return $false }
      $keys = @{}
      foreach ($hk in @($h.Hotkeys)) { if ($hk.TaskSettings.Job -and -not $keys.ContainsKey($hk.TaskSettings.Job)) { $keys[$hk.TaskSettings.Job] = $hk.HotkeyInfo.Hotkey } }
      if ($keys['RectangleRegion'] -ne 'PrintScreen' -or $keys['PrintScreen'] -ne 'PrintScreen, Control') { return $false }
      (Get-ItemProperty 'HKCU:\Control Panel\Keyboard' -ErrorAction SilentlyContinue).PrintScreenKeyForSnippingEnabled -eq 0
    apply: |
      $dir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'ShareX'
      $appFile = Join-Path $dir 'ApplicationConfig.json'
      $hotFile = Join-Path $dir 'HotkeysConfig.json'
      function Read-Config([string]$file) {
          if (Test-Path $file) { Get-Content $file -Raw -Encoding UTF8 | ConvertFrom-Json } else { [pscustomobject]@{} }
      }
      function Save-Config($obj, [string]$file) {
          [IO.File]::WriteAllText($file, ($obj | ConvertTo-Json -Depth 100), (New-Object Text.UTF8Encoding $false))
      }
      function Set-Setting($obj, [string]$path, $value) {
          $parts = $path.Split('.')
          for ($i = 0; $i -lt $parts.Count - 1; $i++) {
              if ($null -eq $obj.($parts[$i])) { $obj | Add-Member -NotePropertyName $parts[$i] -NotePropertyValue ([pscustomobject]@{}) -Force }
              $obj = $obj.($parts[$i])
          }
          # Update in place when the key exists, so the file keeps its order.
          if ($obj.PSObject.Properties[$parts[-1]]) { $obj.($parts[-1]) = $value }
          else { $obj | Add-Member -NotePropertyName $parts[-1] -NotePropertyValue $value }
      }

      # ShareX writes its settings back when it exits, so close it first and start it again at the end.
      $running = @(Get-Process ShareX -ErrorAction SilentlyContinue)
      $exe = if ($running.Count -gt 0) { $running[0].Path } else { Join-Path $env:ProgramFiles 'ShareX\ShareX.exe' }
      if ($running.Count -gt 0) {
          Write-Output 'Closing ShareX.'
          $running | Stop-Process -Force
          $running | Wait-Process -Timeout 10 -ErrorAction SilentlyContinue
      }
      New-Item -ItemType Directory -Force $dir | Out-Null

      $a = Read-Config $appFile
      $want = [ordered]@{
          'UseWhiteShareXIcon'                                                    = $true
          'DefaultTaskSettings.AfterCaptureJob'                                   = 'ShowQuickTaskMenu'
          'DefaultTaskSettings.GeneralSettings.PlaySoundAfterCapture'             = $false
          'DefaultTaskSettings.GeneralSettings.PlaySoundAfterUpload'              = $false
          'DefaultTaskSettings.GeneralSettings.ToastWindowDuration'               = 30
          'DefaultTaskSettings.CaptureSettings.ShowCursor'                        = $false
          'DefaultTaskSettings.CaptureSettings.CaptureTransparent'                = $true
          'DefaultTaskSettings.CaptureSettings.GIFFPS'                            = 30
          'DefaultTaskSettings.CaptureSettings.SurfaceOptions.ImageEditorStartMode' = 'Maximized'
      }
      foreach ($k in $want.Keys) { Set-Setting $a $k $want[$k] }
      $names = @(if ($a.Themes) { $a.Themes | ForEach-Object { $_.Name } })
      $light = [array]::IndexOf($names, 'Light')
      Set-Setting $a 'SelectedTheme' $(if ($light -ge 0) { $light } else { 1 })
      # A preset without a name shows its task's name in the menu.
      Set-Setting $a 'QuickTaskPresets' @(
          [pscustomobject]@{ Name = $null; AfterCaptureTasks = 'AnnotateImage'; AfterUploadTasks = 'None' }
          [pscustomobject]@{ Name = $null; AfterCaptureTasks = 'CopyImageToClipboard'; AfterUploadTasks = 'None' }
          [pscustomobject]@{ Name = 'Save image to file'; AfterCaptureTasks = 'SaveImageToFile, CopyFilePathToClipboard'; AfterUploadTasks = 'None' }
          [pscustomobject]@{ Name = 'OCR'; AfterCaptureTasks = 'DoOCR'; AfterUploadTasks = 'None' }
      )
      Save-Config $a $appFile

      # Swap ShareX's first two defaults: Print Screen captures a region, Ctrl+Print Screen the whole screen.
      $h = Read-Config $hotFile
      function New-Hotkey([string]$job, [string]$key) {
          [pscustomobject]@{ HotkeyInfo = [pscustomobject]@{ Hotkey = $key; Win = $false }; TaskSettings = [pscustomobject]@{ Description = ''; Job = $job } }
      }
      $hotkeys = New-Object Collections.ArrayList
      if ($h.Hotkeys) { $hotkeys.AddRange(@($h.Hotkeys)) }
      else {
          # No file yet: start from ShareX's default list, which the swap below then adjusts.
          $hotkeys.AddRange(@(
              New-Hotkey 'RectangleRegion' 'PrintScreen, Control'
              New-Hotkey 'PrintScreen' 'PrintScreen'
              New-Hotkey 'ActiveWindow' 'PrintScreen, Alt'
              New-Hotkey 'ScreenRecorder' 'PrintScreen, Shift'
              New-Hotkey 'ScreenRecorderGIF' 'PrintScreen, Shift, Control'
          ))
      }
      foreach ($swap in @(@('RectangleRegion', 'PrintScreen'), @('PrintScreen', 'PrintScreen, Control'))) {
          $hk = $hotkeys | Where-Object { $_.TaskSettings.Job -eq $swap[0] } | Select-Object -First 1
          if ($hk) { $hk.HotkeyInfo.Hotkey = $swap[1]; $hk.HotkeyInfo.Win = $false }
          else { [void]$hotkeys.Add((New-Hotkey $swap[0] $swap[1])) }
      }
      Set-Setting $h 'Hotkeys' $hotkeys.ToArray()
      Save-Config $h $hotFile

      # Without this, Windows opens the Snipping Tool on Print Screen before ShareX sees it.
      Set-ItemProperty 'HKCU:\Control Panel\Keyboard' -Name PrintScreenKeyForSnippingEnabled -Value 0 -Type DWord

      # Start it through Explorer so it doesn't run as admin. The startup shortcut starts it in the tray.
      $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'ShareX.lnk'
      if (Test-Path $startup) { Start-Process explorer.exe "`"$startup`"" }
      elseif (Test-Path $exe) { Start-Process explorer.exe "`"$exe`"" }

  - id: start11-groupy-settings
    name: "Start11 and Groupy: license and settings"
    category: Desktop
    dependsOn: [start11, groupy]
    instructions: Enter the licenses, then set them up the way you like them.

  - id: powertoys-settings
    name: "PowerToys: only Keyboard Manager, with F4 and Insert remapped"
    description: F4 acts as Alt+F4 and Insert as Print Screen. Every other PowerToys tool is turned off. Restarts PowerToys.
    category: Desktop
    dependsOn: [powertoys]
    # settings.json lists which tools are on; Keyboard Manager's remaps are in its default.json. Key codes are
    # Windows virtual keys: 115 = F4, 164 = Left Alt, 45 = Insert, 44 = Print Screen. Same values as the apply below.
    detect: |
      $root = Join-Path $env:LOCALAPPDATA 'Microsoft\PowerToys'
      $settingsFile = Join-Path $root 'settings.json'
      $kbmFile = Join-Path $root 'Keyboard Manager\default.json'
      if (-not (Test-Path $settingsFile) -or -not (Test-Path $kbmFile)) { return $false }
      $enabled = (Get-Content $settingsFile -Raw -Encoding UTF8 | ConvertFrom-Json).enabled
      if (-not $enabled -or $enabled.'Keyboard Manager' -ne $true) { return $false }
      # Only the tools this version lists; PowerToys writes the full list once it has run.
      if ($enabled.PSObject.Properties | Where-Object { $_.Name -ne 'Keyboard Manager' -and $_.Value -ne $false }) { return $false }
      $keys = @{}
      foreach ($r in @((Get-Content $kbmFile -Raw -Encoding UTF8 | ConvertFrom-Json).remapKeys.inProcess)) { if ($r) { $keys["$($r.originalKeys)"] = "$($r.newRemapKeys)" } }
      $keys['115'] -eq '164;115' -and $keys['45'] -eq '44'
    apply: |
      $root = Join-Path $env:LOCALAPPDATA 'Microsoft\PowerToys'
      $settingsFile = Join-Path $root 'settings.json'
      $kbmDir = Join-Path $root 'Keyboard Manager'
      $kbmFile = Join-Path $kbmDir 'default.json'
      function Read-Json([string]$file) {
          if (Test-Path $file) { Get-Content $file -Raw -Encoding UTF8 | ConvertFrom-Json } else { [pscustomobject]@{} }
      }
      function Get-ToolCount($settings) {
          if ($settings.enabled) { ($settings.enabled.PSObject.Properties | Measure-Object).Count } else { 0 }
      }
      function Save-Json($obj, [string]$file) {
          [IO.File]::WriteAllText($file, ($obj | ConvertTo-Json -Depth 100 -Compress), (New-Object Text.UTF8Encoding $false))
      }
      function Set-Prop($obj, [string]$name, $value) {
          if ($obj.PSObject.Properties[$name]) { $obj.$name = $value } else { $obj | Add-Member -NotePropertyName $name -NotePropertyValue $value }
      }

      $exe = @((Get-Process PowerToys -ErrorAction SilentlyContinue | Select-Object -First 1).Path,
          (Join-Path $env:ProgramFiles 'PowerToys\PowerToys.exe'), (Join-Path $env:LOCALAPPDATA 'PowerToys\PowerToys.exe')) |
          Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
      if (-not $exe) { throw "PowerToys isn't installed where expected." }
      # Start it through Explorer so it doesn't run as admin.
      function Start-PowerToys { Start-Process explorer.exe "`"$exe`"" }
      # Its tools run as separate PowerToys.* processes that go with it.
      function Stop-PowerToys {
          if (Get-Process PowerToys -ErrorAction SilentlyContinue) {
              Write-Output 'Closing PowerToys.'
              Get-Process PowerToys, PowerToys.* -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 2
          }
      }

      # PowerToys reads these files only when it starts (and may write them back), so close it first.
      Stop-PowerToys
      New-Item -ItemType Directory -Force $kbmDir | Out-Null

      # The tool list isn't written here, since PowerToys keeps adding tools. If it hasn't run on this PC yet,
      # start it once so it writes its own list, then close it again.
      $s = Read-Json $settingsFile
      if ((Get-ToolCount $s) -eq 0) {
          Write-Output 'Starting PowerToys once so it lists its tools.'
          Start-PowerToys
          $deadline = (Get-Date).AddSeconds(90)
          do {
              Start-Sleep -Seconds 3
              try { $s = Read-Json $settingsFile } catch { $s = [pscustomobject]@{} }  # may be mid-write
          } until ((Get-ToolCount $s) -gt 0 -or (Get-Date) -gt $deadline)
          Stop-PowerToys
          if ((Get-ToolCount $s) -eq 0) { throw "PowerToys didn't list its tools. Open it once, then try again." }
      }

      # Turn off every tool it lists but Keyboard Manager.
      foreach ($p in $s.enabled.PSObject.Properties) { $p.Value = ($p.Name -eq 'Keyboard Manager') }
      Set-Prop $s.enabled 'Keyboard Manager' $true
      Save-Json $s $settingsFile

      # Add the two remaps, replacing any other remap of F4 or Insert; other remaps stay.
      $k = Read-Json $kbmFile
      if (-not $k.PSObject.Properties['remapKeys']) { Set-Prop $k 'remapKeys' ([pscustomobject]@{ inProcess = @() }) }
      if (-not $k.PSObject.Properties['remapShortcuts']) { Set-Prop $k 'remapShortcuts' ([pscustomobject]@{ global = @(); appSpecific = @() }) }
      $remaps = @(@($k.remapKeys.inProcess) | Where-Object { $_ -and "$($_.originalKeys)" -notin '115', '45' })
      $remaps += [pscustomobject]@{ originalKeys = '115'; newRemapKeys = '164;115' }
      $remaps += [pscustomobject]@{ originalKeys = '45'; newRemapKeys = '44' }
      Set-Prop $k.remapKeys 'inProcess' $remaps
      Save-Json $k $kbmFile
      $kbmSettings = Join-Path $kbmDir 'settings.json'
      if (-not (Test-Path $kbmSettings)) {
          Save-Json ([pscustomobject]@{ properties = [pscustomobject]@{ activeConfiguration = @{ value = 'default' }; keyboardConfigurations = @{ value = @('default') } }; name = 'Keyboard Manager'; version = '1' }) $kbmSettings
      }

      Start-PowerToys

  - id: onenote-setup
    name: "OneNote: open notebooks and set the layout"
    category: Browsers and productivity
    dependsOn: [onenote]
