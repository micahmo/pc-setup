name: Release

# Push a tag like v0.2.0 to build PCSetup.zip and publish it as the latest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/PCSetup/PCSetup.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None `
            -p:Version=$version -o publish
          Compress-Archive -Path publish/* -DestinationPath PCSetup.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: PCSetup.zip
          generate_release_notes: true
